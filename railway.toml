[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'uv run alembic upgrade head && uv run uvicorn rag.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/v1/livez"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
