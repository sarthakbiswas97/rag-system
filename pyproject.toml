[project]
name = "rag-system"
version = "0.1.0"
description = "Production-grade RAG system with zero hallucination"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "redis>=7.4.0",
    "prometheus-client>=0.25.0",
    "email-validator>=2.3.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["rag"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/rag/api/routes_*.py" = ["B008"]
"src/rag/tenancy/auth.py" = ["B008"]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/rag --cov-report=term-missing"

[dependency-groups]
dev = [
    "locust>=2.44.0",
]
